<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today</title>
  <meta name="description" content="Today's training session.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">

  <!-- Home-screen app (iPhone + Android) -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Today">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">

  <!-- Fonts. sw.js saves them for offline use; keep this address identical to FONT_CSS in sw.js. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply a saved light/dark choice before anything is drawn, so there's no flash.
    try {
      var theme = localStorage.getItem("today.theme");
      if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    } catch (e) { /* no storage: follow the phone */ }

    // If the app can't start (say, a typo after editing plan.js), say so instead of showing a blank page.
    addEventListener("error", function (event) {
      var main = document.getElementById("app");
      if (main && !document.body.hasAttribute("data-ready")) {
        main.textContent = "Couldn't start the app: " + (event.message || "error in plan.js or app.js");
        main.className = "oops";
      }
    });
  </script>
  <script src="plan.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="app">
    <header class="head">
      <p class="date" id="date"></p>
      <h1 class="title" id="title"></h1>
      <p class="note" id="note"></p>
      <div class="progress" id="progress" role="progressbar" aria-label="Done today"
           aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"></div>
    </header>
    <ol class="timeline" id="timeline"></ol>
    <footer class="foot">
      <button type="button" class="theme" id="theme" role="switch" aria-checked="false">
        <span>Dark mode</span><span class="switch" aria-hidden="true"></span>
      </button>
      <button type="button" class="log-open" id="log-open">Log</button>
    </footer>
  </main>

  <!-- Every day so far, newest first. Read-only; opened with the Log button. -->
  <section class="log" id="log" aria-label="Log" hidden>
    <div class="log-head">
      <h2 class="log-heading">Log</h2>
      <button type="button" class="log-close" id="log-close">Close</button>
    </div>
    <ol class="log-list" id="log-list"></ol>
  </section>
</body>
</html>
